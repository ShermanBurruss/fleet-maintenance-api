# Local development stack for the Fleet Maintenance API.
#
# Starts:
#   1. PostgreSQL 17
#   2. FastAPI
#
# The API waits for PostgreSQL to become healthy, applies all Alembic
# migrations, and then starts the web server.

services:

  db:
    image: postgres:17

    environment:
      # These credentials are intentionally local-development values.
      # Production credentials must be supplied securely through the
      # deployment environment.
      POSTGRES_USER: fleetuser
      POSTGRES_PASSWORD: fleetpass
      POSTGRES_DB: fleetdb

    ports:
      - "5432:5432"

    volumes:
      # Preserve PostgreSQL data between container restarts.
      - postgres_data:/var/lib/postgresql/data

      # Create the separate Pytest database when PostgreSQL initializes
      # a brand-new data volume.
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U fleetuser -d fleetdb"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  api:
    build:
      context: .

    environment:
      # Containers communicate using Compose service names rather than
      # localhost. The PostgreSQL service is named "db".
      DATABASE_URL: postgresql+psycopg://fleetuser:fleetpass@db:5432/fleetdb

      # Required by the application's Settings model. Pytest normally
      # uses this database when tests are run from the host machine.
      TEST_DATABASE_URL: postgresql+psycopg://fleetuser:fleetpass@db:5432/fleetdb_test

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    # Apply pending migrations before allowing the API to start.
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "



volumes:
  postgres_data: