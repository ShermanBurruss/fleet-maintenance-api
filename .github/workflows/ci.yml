name: CI

# Run the workflow whenever code is pushed to main
# or a pull request targets main.
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# The workflow only needs permission to read repository contents.
permissions:
  contents: read


jobs:
  test:
    name: Test API

    # PostgreSQL service containers require a Linux runner.
    runs-on: ubuntu-latest

    # These credentials are temporary and exist only inside the
    # disposable GitHub Actions runner.
    env:
      DATABASE_URL: postgresql+psycopg://fleetuser:fleetpass@localhost:5432/fleetdb_test
      TEST_DATABASE_URL: postgresql+psycopg://fleetuser:fleetpass@localhost:5432/fleetdb_test

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: fleetuser
          POSTGRES_PASSWORD: fleetpass
          POSTGRES_DB: fleetdb_test

        ports:
          - 5432:5432

        # Wait until PostgreSQL is ready before starting the tests.
        options: >-
          --health-cmd "pg_isready -U fleetuser -d fleetdb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      # Download the repository onto the GitHub runner.
      - name: Check out repository
        uses: actions/checkout@v6

      # Match the Python version currently used by the project.
      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.10"
          cache: "pip"

      # Install the same dependencies used during local development.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Verify that Alembic can construct the database schema
      # from an empty PostgreSQL database.
      - name: Apply database migrations
        run: alembic upgrade head

      # Run the automated API test suite.
      - name: Run tests
        run: pytest -v